name: Check IPinside in isolated HA image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Prepare a disposable copy of the deployed image
        run: |
          set -euo pipefail
          curl -fsS 'https://vbv.samsungcard.co.kr/ipinsidelws/agent/IPinside-LWS.x86_64.deb' -o official.deb
          echo '8f81c53e2f60a67e1fe563c8560048ff5894a0c0c07e7a5077325f2bdfc57da1  official.deb' | sha256sum -c -
          cat > Dockerfile <<'DOCKER'
          FROM ghcr.io/kojungho/swim-reservation:2.15.59
          RUN apt-get update && apt-get install -y --no-install-recommends sudo psmisc desktop-file-utils ethtool policykit-1 libnss3-tools net-tools libstdc++6
          COPY official.deb /tmp/official.deb
          DOCKER
          docker build -t swim-ipinside-offline .
      - name: Install and test local startup with external networking disabled
        run: |
          docker run --rm --network none --security-opt no-new-privileges --entrypoint /bin/sh swim-ipinside-offline -ec '
            echo "Packaged version: $(dpkg-deb -f /tmp/official.deb Version)"
            dpkg -i /tmp/official.deb
            dpkg-query -W ipinside-lws
            /etc/init.d/ipinside-lws start || true
            node -e "const net=require(\"node:net\");let n=0;function check(){const s=net.connect(21400,\"127.0.0.1\");s.once(\"connect\",()=>{console.log(\"Local service socket accepted a connection\");s.destroy()});s.once(\"error\",()=>{if(++n<12)setTimeout(check,500);else{console.log(\"Local service socket unavailable\");process.exitCode=1}})}check()"
          '
