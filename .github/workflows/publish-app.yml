name: Publish HA app images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-app.yml'
      - 'swim_reservation/Dockerfile'
      - 'swim_reservation/package.json'
      - 'swim_reservation/src/**'
      - 'swim_reservation/public/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-ha-app
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "version=$(node -p 'require("./swim_reservation/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: home-assistant/builder/actions/build-image@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          arch: ${{ matrix.arch }}
          context: ./swim_reservation
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ghcr.io/kojungho/${{ matrix.arch }}-swim-reservation
          image-tags: ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=쉼오지 예약 도우미
            io.hass.url=https://github.com/kojungho/swim-reservation-ha-app
          push: true
  manifest:
    name: Publish multi-architecture image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: echo "version=$(node -p 'require("./swim_reservation/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@4de35182ce1e329181bffcbcc84d33db5e2c7e10 # 2026.06.0
        with:
          architectures: '["amd64", "aarch64"]'
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: swim-reservation
          registry-prefix: ghcr.io/kojungho
          image-tags: ${{ steps.version.outputs.version }}
