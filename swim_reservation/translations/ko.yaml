configuration:
  notifications_enabled:
    name: 전체 알림
    description: 끄면 개별 설정을 보존한 채 이 애드온의 휴대폰 알림을 모두 중지합니다.
  scheduled_pass_notifications:
    name: 예약 사전 점검 통과
    description: 예약 일정의 사전 점검을 통과하면 알립니다.
  scheduled_unavailable_notifications:
    name: 예약 사전 점검 미완료
    description: 점검에 사용할 빈자리가 없어 사전 점검을 마치지 못하면 알립니다.
  scheduled_issue_notifications:
    name: 예약 사전 점검 확인 필요
    description: 예약 일정의 사전 점검이 실패하거나 중단되면 알립니다.
  booking_error_notifications:
    name: 예약 실행 오류
    description: 예약 실행이 실패하거나 결과 확인이 필요하면 알립니다.
  watch_error_notifications:
    name: 취소 대기 조회 오류
    description: 취소 대기 중 빈자리 조회 오류가 발생하면 알립니다.
  daily_check_notifications:
    name: 일일 점검 알림
    description: 매일 오전 10시 예약 점검에서 문제가 발견되면 휴대폰으로 알립니다. 끄더라도 점검 결과는 실행 기록에 남습니다.
  error_notify_service:
    name: 오류 알림 서비스
    description: 예약 알림을 받을 Home Assistant 모바일 앱 서비스 이름입니다.
