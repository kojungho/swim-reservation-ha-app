plugins { id 'com.android.application' }
android {
    namespace 'kr.swim.phone'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.swim.phone'
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName '0.4.7'
        testInstrumentationRunner project.findProperty('phoneTestRunner') ?: 'kr.swim.phone.EngineTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
}
dependencies { coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' }
