plugins { id 'com.android.application' }
android {
    namespace 'kr.swim.phone'
    compileSdk 36
    defaultConfig {
        applicationId 'kr.swim.phone'
        minSdk 26
        targetSdk 36
        versionCode 20
        versionName '0.4.14'
        buildConfigField 'String', 'DEFAULT_HA_URL', '"' + (project.findProperty('phoneHaUrl') ?: 'https://ha.badara.co.kr').replace('"','') + '"'
        testInstrumentationRunner project.findProperty('phoneTestRunner') ?: 'kr.swim.phone.EngineTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { buildConfig true }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.json:json:20240303'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5' }
